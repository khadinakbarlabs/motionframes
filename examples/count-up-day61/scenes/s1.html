<script>
  const turn = at("L3");
  // watering: one pour per cue (0.5 s + 1.05 s each, 7 times), then he waits
  for (let k = 0; k < 7; k++) {
    const t = S.start + 0.5 + k * 1.05;
    fx.show("#s1-water", t); fx.hide("#s1-water", t + 0.55);
    fx.pose("s1-me", "reach", t - 0.1, 0.25); fx.pose("s1-me", "idle", t + 0.6, 0.3);
  }
  fx.pose("s1-me", "think", at("L2") + 0.2, 0.4);
  // roots grow out of sight while the counter climbs
  ["#s1-r1", "#s1-r2", "#s1-r3", "#s1-r4", "#s1-r5", "#s1-r6", "#s1-r7"].forEach((r, k) => {
    tl.fromTo(r, { strokeDasharray: 700, strokeDashoffset: 700 }, { strokeDashoffset: 0, duration: 2.4, ease: "sine.out", immediateRender: false }, 1.0 + k * 0.95);
    tl.set(r, { strokeDasharray: 700, strokeDashoffset: 700 }, 0);
  });
  fx.count("#s1-num", [[0.3, 1], [4.5, 22], [7.6, 60], [turn - 0.05, 60], [turn, 61]], { ease: "power1.in" });
  fx.move("#s1-num", { fill: "#F4B860" }, turn, 0.25);
  fx.glow("#s1-glow", turn, { dur: 1.2 });
  fx.glow("#s1-rays", turn + 0.15, { dur: 1.4 });
  fx.pop("#s1-tree", turn, { from: 0.2, dur: 0.6, origin: "50% 100%" });
  fx.pose("s1-me", "cheer", turn + 0.15, 0.35);
  fx.flicker("#s1-glow", turn + 1.3, S.end, { amt: 0.12 });
</script>
