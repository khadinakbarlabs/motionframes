<!-- s5: expansion joint teeth slide open (winter) and closed (summer) -->
<rect id="s5-sky" width="1080" height="1920" fill="#8fc7ff" />
<g id="s5-left"><path d="M-20 1000 H500 l40 40 l-40 40 l40 40 l-40 40 H-20 Z" fill="#9fb3d6" stroke="#0f1220" stroke-width="8" /></g>
<g id="s5-right"><path d="M1100 1000 H580 l40 40 l-40 40 l40 40 l-40 40 H1100 Z" fill="#9fb3d6" stroke="#0f1220" stroke-width="8" /></g>
<text id="s5-word" x="540" y="760" text-anchor="middle" font-family="Archivo Black" font-size="110" fill="#0f1220" opacity="0">❄</text>
<script>
  tl.set("#s5-left", { x: -60 }, S.start).set("#s5-right", { x: 60 }, S.start);
  tl.to("#s5-sky", { fill: "#ffb066", duration: 0.6 }, at("L4:closed") - 0.2);
  tl.to("#s5-left", { x: 0, duration: 0.6, ease: "power2.inOut" }, at("L4:closed") - 0.2);
  tl.to("#s5-right", { x: 0, duration: 0.6, ease: "power2.inOut" }, at("L4:closed") - 0.2);
  tl.to(["#s5-left", "#s5-right"], { x: (i) => (i ? 30 : -30), duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, at("L4:breathes"));
  fx.cam("#s5-cam", { scale: 1.3 }, at("L4:slide"), 1.0, "540 1080");
</script>
