<rig type="bean" id="pip3" x="370" y="1262" scale="1.05" shirt="#2ec4b6" face="neutral" pose="hips" />
<script>
  fx.look("pip3", 1, at("L2:found") + 0.1);
  fx.face("pip3", "surprised", at("L2:gap") - 0.05);
  fx.pose("pip3", "point", at("L2:gap"));
  fx.cam("#s3-cam", { scale: 1.18 }, at("L2:gap") - 0.2, 0.9, "500 700");
  const drop = at("L2:swallow") - 0.25;
  tl.set("#s3-phone", { opacity: 1 }, drop);
  tl.fromTo("#s3-phone", { y: 0, rotation: 0 }, { y: 330, rotation: 70, svgOrigin: "540 1049", duration: 0.45, ease: "power2.in", immediateRender: false }, drop);
  tl.set("#s3-phone", { opacity: 0 }, drop + 0.45);
  tl.fromTo("#s3-splash", { opacity: 1, scale: 0.3, svgOrigin: "540 1400" }, { opacity: 0, scale: 1.5, duration: 0.6, ease: "power2.out", immediateRender: false }, drop + 0.45);
  tl.fromTo("#s3-drops", { opacity: 1, y: 40 }, { opacity: 0, y: -40, duration: 0.5, ease: "power2.out", immediateRender: false }, drop + 0.45);
  fx.face("pip3", "shocked", drop + 0.4);
  fx.pose("pip3", "reach", drop + 0.4, 0.25);
  fx.squash("#pip3", drop + 0.35, { amt: 0.1 });
</script>
